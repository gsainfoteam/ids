name: Set up the workspace
description: Install pnpm, Node and the workspace dependencies, and build the packages unless told not to.

inputs:
  build:
    description: Build the packages after installing.
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    - if: inputs.build == 'true'
      run: pnpm build
      shell: bash
