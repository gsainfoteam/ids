name: Release

# pub.dev 는 태그 push 로 트리거된 워크플로에서만 게시를 허용한다.
# release: published 는 GITHUB_REF 가 태그를 가리켜도 거부된다.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  npm:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@gsainfoteam"

      - run: pnpm install --frozen-lockfile

      - run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flutter:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # pub.dev OIDC 자격 증명을 주입한다. flutter-action 은 이걸 하지 않아서
      # 이 스텝이 없으면 publish 가 인증 없이 실패한다.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"

      - run: flutter pub get
        working-directory: packages/flutter

      - run: flutter pub publish --force
        working-directory: packages/flutter
