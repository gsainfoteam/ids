name: Release

on:
  release:
    types: [published]

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  flutter:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    needs: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"

      - name: Sync Flutter version from ids-css
        run: |
          VERSION=$(node -p "require('./packages/css/package.json').version")
          sed -i "s/^version:.*/version: $VERSION/" packages/flutter/pubspec.yaml

      - run: flutter pub get
        working-directory: packages/flutter

      - run: flutter pub publish --force
        working-directory: packages/flutter
