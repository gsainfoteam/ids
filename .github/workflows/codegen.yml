name: Codegen

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/tokens/**'
      - 'packages/core/sd.config.js'

jobs:
  codegen:
    name: Run Style Dictionary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm codegen

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            packages/css/dist/ids.css \
            packages/react/src/tokens/types.ts \
            "packages/flutter/lib/tokens/*.dart"
          git diff --staged --quiet || git commit -m "chore: codegen [skip ci]"
          git push
