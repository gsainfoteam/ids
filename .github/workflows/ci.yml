name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

jobs:
  checks:
    name: Lint / typecheck / build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          build: false

      - run: pnpm codegen

      - name: Check generated files are up to date
        run: |
          if ! git diff --exit-code -- packages/css/dist packages/react/src/tokens packages/flutter/lib/tokens; then
            echo "Generated files are out of date. Run 'pnpm codegen' and commit the result."
            exit 1
          fi

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm build

      - name: Check react ships type declarations
        run: test -f packages/react/dist/index.d.ts

      - name: Check the bundle size budget
        run: pnpm size

      - name: Build the Next.js, TanStack Start and Astro examples
        run: pnpm examples:build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Check the examples server-render IDS
        run: pnpm examples:check

  chromium:
    name: Chromium tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm --filter @gsainfoteam/ids-react exec playwright install --with-deps --only-shell chromium

      - run: pnpm --filter @gsainfoteam/ids-react exec vitest run --shard ${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          IDS_BROWSERS: chromium

      - name: Upload the failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-chromium-${{ matrix.shard }}
          path: packages/react/.vitest/attachments/failure-screenshots

  firefox:
    name: Firefox tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox]
        retry: [0]
        shard: [1, 2, 3, 4, 5]
    steps: &engine-steps
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Install ${{ matrix.browser }}
        run: pnpm --filter @gsainfoteam/ids-react exec playwright install --with-deps --only-shell ${{ matrix.browser }}

      - run: pnpm --filter @gsainfoteam/ids-react exec vitest run --project browser --shard ${{ matrix.shard }}/${{ strategy.job-total }} --retry ${{ matrix.retry }}
        env:
          IDS_BROWSERS: ${{ matrix.browser }}

      - name: Upload the failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.browser }}-${{ matrix.shard }}
          path: packages/react/.vitest/attachments/failure-screenshots

  webkit:
    name: WebKit tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit]
        retry: [1]
        shard: [1, 2, 3, 4, 5]
    steps: *engine-steps

  js:
    name: JS (lint / typecheck / build / test)
    needs: [checks, chromium]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "$CHECKS" = success && test "$CHROMIUM" = success
        env:
          CHECKS: ${{ needs.checks.result }}
          CHROMIUM: ${{ needs.chromium.result }}

  firefox-result:
    name: Browser tests (firefox)
    needs: firefox
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "$SHARDS" = success
        env:
          SHARDS: ${{ needs.firefox.result }}

  webkit-result:
    name: Browser tests (webkit)
    needs: webkit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "$SHARDS" = success
        env:
          SHARDS: ${{ needs.webkit.result }}

  visual:
    name: Visual regression (Playwright Linux image)
    if: vars.IDS_VISUAL_CHECK == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare every Gallery in light and dark with the committed baselines
        run: node scripts/visual.mjs

      - name: Upload the screenshots that differ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: packages/react/.vitest/visual

  flutter:
    name: Flutter (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"

      - run: flutter pub get
        working-directory: packages/flutter

      - run: flutter test
        working-directory: packages/flutter

  review:
    name: Claude review
    needs: [js, flutter]
    if: github.event_name == 'pull_request' && vars.ENABLE_CLAUDE_REVIEW == 'true'
    permissions:
      contents: read
      pull-requests: write
      actions: read
      id-token: write
    uses: rhseung/claude-review-plugin/.github/workflows/review.yml@2fa5d4bb8b4e8896757861d7d53237bb2f7bdeac
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
