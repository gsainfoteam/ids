name: CI

on:
  pull_request:
    branches: [main]

jobs:
  js:
    name: JS (lint / typecheck / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm codegen

      - name: Check generated files are up to date
        run: |
          if ! git diff --exit-code -- packages/css/dist packages/react/src/tokens packages/flutter/lib/tokens; then
            echo "Generated files are out of date. Run 'pnpm codegen' and commit the result."
            exit 1
          fi

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm build

  flutter:
    name: Flutter (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"

      - run: flutter pub get
        working-directory: packages/flutter

      - run: flutter test
        working-directory: packages/flutter
