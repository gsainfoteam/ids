name: Held image hunt (temporary)

on:
  pull_request:
    branches: [main]

jobs:
  hunt:
    name: Held image hunt ${{ matrix.copy }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for browser tests
        run: pnpm --filter @gsainfoteam/ids-react exec playwright install --with-deps --only-shell chromium

      - run: pnpm test
        env:
          IDS_BROWSERS: chromium

      - name: Upload the failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-hunt-${{ matrix.copy }}
          path: packages/react/.vitest/attachments/failure-screenshots
