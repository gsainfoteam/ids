name: Marquee and Carousel flake loop (temporary)

on:
  pull_request:
    branches: [main]

jobs:
  hunt:
    name: Flake loop ${{ matrix.copy }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for browser tests
        run: pnpm --filter @gsainfoteam/ids-react exec playwright install --with-deps --only-shell chromium

      - run: pnpm build

      - name: Run the whole suite six times
        working-directory: packages/react
        env:
          IDS_BROWSERS: chromium
        run: |
          status=0
          for round in 1 2 3 4 5 6; do
            pnpm exec vitest run > run.log 2>&1 || status=1
            echo "round $round"
            grep -E "FAIL |Test Files|Expected|Received" run.log | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-3000
          done
          exit $status

      - name: Upload the failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-loop-${{ matrix.copy }}
          path: packages/react/.vitest/attachments/failure-screenshots
