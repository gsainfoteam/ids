name: ids_flutter
description: Infoteam Design System — Flutter package.
version: 0.1.1
repository: https://github.com/gsainfoteam/ids

environment:
  sdk: ^3.11.5
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  slang: ^4.19.2

flutter:
  uses-material-design: true
  fonts:
    - family: Pretendard GOV Variable
      fonts:
        - asset: fonts/PretendardGOVVariable.ttf
